services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard at /dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__TELEMETRY_DISABLED: "true"
      # Uncomment to require an API key once this leaves localhost:
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      # Back on its default. Langfuse's MinIO wanted 9090 too, and moving
      # Prometheus to 9091 only traded that clash for one with MinIO's
      # console. Fixed at the source instead: ops/langfuse/
      # docker-compose.override.yml stops Langfuse publishing eight of its
      # nine ports and moves MinIO to 9190, so this one is free again.
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    ports:
      # 3001 on the host: Langfuse's dashboard takes 3000, and it is the
      # harder one to move -- its NEXTAUTH_URL has to match the port the
      # browser uses, so changing it means changing two things that must
      # agree. Grafana has no such coupling, so Grafana moves.
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  qdrant_storage:
  prometheus_data:
  grafana_data:
